<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="128" height="128">
  <defs>
    <linearGradient id="diskSquircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="diskShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- iOS / macOS Squircle App Icon Tile -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#diskSquircleGrad)" filter="url(#diskShadow)"/>
  <rect x="18" y="18" width="220" height="220" rx="50" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>

  <!-- SRE Disk Guard Emblem -->
  <g transform="translate(48, 48)">
    <!-- Base Shield -->
    <path d="M 80 12 L 140 32 L 140 85 C 140 125 80 148 80 148 C 80 148 20 125 20 85 L 20 32 Z" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
    <!-- Hard Disk Platters -->
    <ellipse cx="80" cy="55" rx="36" ry="12" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
    <ellipse cx="80" cy="74" rx="36" ry="12" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
    <ellipse cx="80" cy="93" rx="36" ry="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <!-- Clean Invariant Check Mark -->
    <path d="M 66 74 L 76 84 L 98 62" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
